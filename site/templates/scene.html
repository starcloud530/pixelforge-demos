<figure class="viewer view-scene" data-viewer aria-label="{{ sceneName }}">
  <a class="art-stage" data-enlarge href="{{ media:tidal-glasshouse.png }}" aria-label="{{ enlargeScene }}" title="{{ enlarge }}">
    <img src="{{ media:tidal-glasshouse.png }}" alt="{{ sceneAlt }}" fetchpriority="high">
    <span class="expand-icon" aria-hidden="true">{{ icon:expand }}</span>
  </a>
  <figcaption><span class="view-choices" role="group" aria-label="{{ sceneViews }}"><a data-choice data-description="{{ sceneAlt }}" data-metric="416 × 288 px" href="{{ media:tidal-glasshouse.png }}" aria-current="true">{{ sceneView }}</a>
<a data-choice data-description="{{ facadeAlt }}" data-metric="{{ facadeSize }}" href="{{ media:glasshouse-facade-preview.png }}" >{{ facadeView }}</a>
<a data-choice data-description="{{ tilesAlt }}" data-metric="{{ tileSize }}" href="{{ media:tiles.png }}" >{{ tilesView }}</a></span><span data-metric-label class="metric">416 × 288 px</span></figcaption>
</figure>
